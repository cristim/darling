name: Release prebuilt binaries

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      force:
        description: Build even if no module changed since the previous release
        type: boolean
        default: false
      allow_partial:
        description: Publish a prerelease even if one architecture failed
        type: boolean
        default: false
  # ---- PILOT ONLY: delete this block; the VibeDarling workflow has no push trigger ----
  push:
    branches: [ci/prebuilt-release]
  # ---- end PILOT ONLY ----

permissions: {}

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  SOURCE_REPO: VibeDarling/darling
  # ---- PILOT ONLY: delete this block (the EXTRA_CMAKE_ARGS line and its comments) to build with Metal ----
  # Metal is off while darling-metal#28 / mslc#201 are open; the -I covers MTLDevice.mm including
  # <mslc/mslc.h> outside its DARLING_METAL_ENABLED guard. This is the only place the pilot flags live.
  EXTRA_CMAKE_ARGS: -DENABLE_METAL=OFF -DCMAKE_CXX_FLAGS=-I/mnt/darling-work/ws/source/src/external/metal/deps/mslc/include
  # ---- end PILOT ONLY ----

jobs:
  prepare:
    if: ${{ github.event_name != 'schedule' || github.repository == 'VibeDarling/darling' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.diff.outputs.build }}
      recipe: ${{ steps.diff.outputs.recipe }}
    env:
      FORCE: ${{ github.event_name == 'push' || inputs.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ci
          persist-credentials: false

      - name: Refuse releases from other repositories or refs
        run: |
          [ "$GITHUB_REPOSITORY" = VibeDarling/darling ] && [ "$GITHUB_REF" = refs/heads/master ] || [ -n "$EXTRA_CMAKE_ARGS" ] || {
            echo "releases are built only from refs/heads/master of VibeDarling/darling (or by the PILOT block)" >&2
            exit 1
          }

      - name: Refuse pilot flags on a stable release
        env:
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          [ -z "$EXTRA_CMAKE_ARGS" ] || [ "$PRERELEASE" = "true" ] || {
            echo "EXTRA_CMAKE_ARGS (the PILOT ONLY block) is set; only prerelease runs may use it. Delete the block to build stable releases." >&2
            exit 1
          }

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git ls-remote "https://github.com/${SOURCE_REPO}.git" HEAD | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "cannot resolve $SOURCE_REPO HEAD: '$sha'" >&2; exit 1; }
          base="v$(date -u +%Y.%m.%d)-${sha:0:7}"
          tag="$base"; n=2
          while out=$(gh release view "$tag" 2>&1); do tag="$base-r$n"; n=$((n+1)); done
          case "$out" in *"release not found"*) ;; *) echo "cannot check release $tag: $out" >&2; exit 1;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch the locks and manifest of the previous runtime release
        continue-on-error: ${{ env.FORCE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir prev cur
          gh api "repos/${GH_REPO}/releases?per_page=100" > releases.json
          tag=$(python3 ci/scripts/ci/lock_diff.py select-release --releases releases.json)
          echo "previous runtime release: ${tag:-none}"
          [ -z "$tag" ] || gh release download "$tag" --dir prev \
            --pattern refs.lock.json --pattern nested.refs.lock.json --pattern manifest.json

      - name: Lock the current default-branch heads
        run: |
          git clone --quiet "https://github.com/${SOURCE_REPO}.git" src
          python3 ci/tools/all-vibedarling-pr-prefix.py resolve --source src --no-prs --output cur/refs.lock.json
          if [ -f prev/nested.refs.lock.json ]; then
            python3 ci/scripts/ci/lock_diff.py refresh-nested --builder ci/tools/all-vibedarling-pr-prefix.py \
              --lock prev/nested.refs.lock.json --output cur/nested.refs.lock.json
          else
            echo '{"vibedarling": [], "external_pinned": []}' > cur/nested.refs.lock.json
          fi

      - name: Decide whether to build
        id: diff
        run: |
          force=""; [ "$FORCE" = "true" ] && force="--force"
          recipe=$(python3 ci/scripts/ci/lock_diff.py recipe "--extra=$EXTRA_CMAKE_ARGS" \
            ci/.github/workflows/release-binaries.yml ci/scripts/ci/package_runtime.py \
            ci/scripts/ci/install-build-deps.py ci/tools/all-vibedarling-pr-prefix.py)
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          python3 ci/scripts/ci/lock_diff.py diff --old prev --new cur --recipe "$recipe" --markdown cur/changes.md \
            --github-output "$GITHUB_OUTPUT" $force
          cat cur/changes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lock-diff
          path: cur/changes.md
          if-no-files-found: error

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      W: /mnt/darling-work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ci
          persist-credentials: false

      - name: Free disk and create workspace on /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$W" && sudo chown "$USER" "$W"
          df -h / /mnt

      - name: Fetch the superproject at the resolved commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git clone "https://github.com/${SOURCE_REPO}.git" "$W/darling"
          [ "$(git -C "$W/darling" rev-parse HEAD)" = "$SHA" ] \
            || { echo "$SOURCE_REPO moved since the prepare job; re-run" >&2; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          python3 ci/scripts/ci/install-build-deps.py "$W/darling/debian/control"
          sudo apt-get install -y --no-install-recommends ccache zstd

      - name: Lock default branches (no PRs) and check out
        run: |
          B="$GITHUB_WORKSPACE/ci/tools/all-vibedarling-pr-prefix.py"
          python3 "$B" resolve --source "$W/darling" --no-prs --output "$W/refs.lock.json"
          python3 "$B" checkout --lock "$W/refs.lock.json" --workspace "$W/ws"
          python3 "$B" resolve-nested --workspace "$W/ws" --no-prs --output "$W/nested.refs.lock.json"
          python3 "$B" checkout-nested --workspace "$W/ws" --lock "$W/nested.refs.lock.json"
          df -h /mnt

      - name: ccache key
        id: key
        env:
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          ARCH: ${{ matrix.arch }}
        run: |
          h=$(python3 -c "import json,hashlib;l=json.load(open('$W/refs.lock.json'));print(hashlib.sha256(json.dumps(sorted((r['repo'],r['base']) for r in l['repos'])).encode()).hexdigest()[:16])")
          echo "prefix=ccache-${ARCH}-${RECIPE:0:16}-" >> "$GITHUB_OUTPUT"
          echo "k=ccache-${ARCH}-${RECIPE:0:16}-$h" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache
          key: ${{ steps.key.outputs.k }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Configure, build and stage with the builder
        run: |
          ccache --max-size=3G
          args=(--cmake-arg=-DCMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg=-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          for a in $EXTRA_CMAKE_ARGS; do args+=("--cmake-arg=$a"); done
          python3 "$GITHUB_WORKSPACE/ci/tools/all-vibedarling-pr-prefix.py" build --workspace "$W/ws" \
            --stage-only --jobs "$(nproc)" "${args[@]}"
          ccache -s

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir out
          python3 ci/scripts/ci/package_runtime.py fragment --image "$W/ws/image" \
            --version "$VERSION" --arch "$ARCH" --out out
          cp "$W/refs.lock.json" "$W/nested.refs.lock.json" out/
          cp "$W/ws/runtime.manifest.json" "out/runtime.manifest-$ARCH.json"

      - name: Smoke test (informational, hosted runners may lack namespaces)
        continue-on-error: true
        run: |
          export DPREFIX="$W/smoke-prefix" DARLING_INSTALL_PREFIX="$W/ws/image/usr/local"
          "$W/ws/build/src/startup/darling" shell true
          "$W/ws/build/src/startup/darling" shutdown

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse releases from other repositories or refs
        run: |
          [ "$GITHUB_REPOSITORY" = VibeDarling/darling ] && [ "$GITHUB_REF" = refs/heads/master ] || [ -n "$EXTRA_CMAKE_ARGS" ] || {
            echo "releases are built only from refs/heads/master of VibeDarling/darling (or by the PILOT block)" >&2
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: runtime-aarch64
          path: art/runtime-aarch64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: runtime-x86_64
          path: art/runtime-x86_64

      - name: Decide the release kind
        id: kind
        env:
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          shopt -s nullglob
          frags=(art/*/fragment-*.json)
          pre="$PRERELEASE"
          if [ "${#frags[@]}" -ne 2 ]; then
            [ "$ALLOW_PARTIAL" = "true" ] || { echo "${#frags[@]} of 2 architectures built; re-run, or dispatch with allow_partial" >&2; exit 1; }
            pre=true
          fi
          flag=""; [ "$pre" = "true" ] && flag="--prerelease"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"

      - name: Build manifest and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SRC_SHA: ${{ needs.prepare.outputs.sha }}
          RECIPE: ${{ needs.prepare.outputs.recipe }}
          FLAG: ${{ steps.kind.outputs.flag }}
          SOURCE_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          frags=(art/*/fragment-*.json)
          mkdir rel
          cp art/*/*.tar.zst art/*/runtime.manifest-*.json rel/
          first=$(ls -d art/*/ | head -1)
          cp "$first"refs.lock.json "$first"nested.refs.lock.json rel/
          python3 scripts/ci/package_runtime.py merge --version "$VERSION" \
            --repo "$REPO" --sha "$SRC_SHA" \
            --fragments "${frags[@]}" --lock-dirs art/*/ $FLAG \
            --published-at "$(date -u +%FT%TZ)" --run-url "$RUN_URL" \
            --builder "$REPO@$GITHUB_SHA" --cmake-args "$EXTRA_CMAKE_ARGS" \
            --recipe-sha "$RECIPE" --source-ref "$SOURCE_REF" --out rel/manifest.json
          (cd rel && sha256sum *.tar.zst runtime.manifest-*.json manifest.json refs.lock.json nested.refs.lock.json > SHA256SUMS)
          cat rel/manifest.json

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: rel/*

      - name: Create release (draft first, then publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
          FLAG: ${{ steps.kind.outputs.flag }}
          SRC_SHA: ${{ needs.prepare.outputs.sha }}
          SOURCE_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          notes="Built from $SOURCE_REPO $SRC_SHA (default or declared branches, no PRs). Extra CMake args: $EXTRA_CMAKE_ARGS. Locks: refs.lock.json, nested.refs.lock.json. Verify: gh attestation verify <file> --repo $REPO --signer-workflow $REPO/.github/workflows/release-binaries.yml --source-ref $SOURCE_REF --deny-self-hosted-runners"
          gh release create "$TAG" rel/* --draft $FLAG --target "$GITHUB_SHA" \
            --title "Darling runtime $TAG" --notes "$notes"
          gh release edit "$TAG" --draft=false

  notify-failure:
    needs: [prepare, build, publish]
    if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Nightly release build is failing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: lock-diff
          path: diff

      - name: Open or update the issue
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "prepare ${{ needs.prepare.result }}, build ${{ needs.build.result }}, publish ${{ needs.publish.result }}"
        run: |
          {
            echo "Scheduled run $RUN_URL failed ($RESULTS)."
            echo
            echo "Modules changed since the last green build (the latest stable runtime release):"
            echo
            if [ -f diff/changes.md ]; then cat diff/changes.md; else echo "Not available: the prepare job did not finish."; fi
          } > body.md
          number=$(gh issue list --state open --author app/github-actions --limit 1000 \
            --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
